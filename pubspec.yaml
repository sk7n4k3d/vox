  chewie: ^1.13.0
  collection: ^1.18.0
  cross_file: ^0.3.5
  desktop_drop: ^0.7.0
  desktop_notifications: ^0.6.3
  device_info_plus: ^12.3.0
  dynamic_color: ^1.8.1
  emoji_picker_flutter: ^4.4.0
  file_picker: ^10.3.10
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_foreground_task: ^9.2.1
  flutter_linkify: ^6.0.0
  linkify: ^5.0.0
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_new_badger: ^1.1.1
  flutter_secure_storage: ^10.0.0
  flutter_shortcuts_new: ^2.0.0
  flutter_vodozemac: ^0.5.0
  flutter_web_auth_2: ^5.0.1
  flutter_webrtc: ^1.3.1
  geolocator: ^14.0.2
  glow_effects: ^0.2.0
  go_router: ^17.1.0
  handy_window: ^0.4.2
  haptic_feedback: ^0.5.1+1
  highlight: ^0.7.0
  html: ^0.15.4
  http: ^1.6.0
  image: ^4.7.2
  image_picker: ^1.2.1
  intl: any
  just_audio: ^0.10.5
  latlong2: ^0.9.1
  markdown: ^7.2.2
  matrix: ^6.2.0
  mime: ^2.0.0
  motor: ^1.1.0
  native_imaging: ^0.4.0
  opus_caf_converter_dart: ^1.0.1
  package_info_plus: ^9.0.0
  particles_network: ^1.9.3
  path: ^1.9.0
  path_provider: ^2.1.2
  pretty_qr_code: ^3.6.0
  provider: ^6.0.2
  punycode: ^1.0.0
  qr_code_scanner_plus: ^2.1.1
  qr_image: ^1.0.0
  receive_sharing_intent: ^1.8.1
  record: ^6.1.2
  scroll_to_index: ^3.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4 # Pinned because https://github.com/flutter/flutter/issues/118401
  slugify: ^2.0.0
  sqflite_common_ffi: ^2.3.7+1
  sqlcipher_flutter_libs: ^0.6.8
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  video_compress: ^3.1.4
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.5.0
  webrtc_interface: ^1.3.0
  local_auth: ^3.0.1
  animated_emoji: ^3.2.1
  flutter_confetti: ^0.5.1

dev_dependencies:
  dart_code_linter: ^3.2.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  license_checker: ^1.6.2
  translations_cleaner: ^0.1.1

flutter_native_splash:
  color: "#05010E"
  color_dark: "#05010E"
  image: "assets/info-logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
    - assets/vodozemac/
    - assets/effects/
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-SemiBold.ttf
          weight: 600

# Guidelines for adding a dependency override:
# 1. Don't do it if you can avoid it or fix it upstream in a manageable time
# 2. Always link an (upstream?) issue
# 3. Explain how and when this can be removed (overrides must be temporarily)
dependency_overrides:
  # To fix 16kb compatiblity in PlayStore. It is fixed in main branch but
  # not yet published:
  # https://github.com/google/webcrypto.dart/issues/207
  webcrypto:
    git:
      url: https://github.com/google/webcrypto.dart.git
      ref: master
  # Bastien fork: patched matrix-dart-sdk v6.2.0 with try/catch around
  # sqflite get/getAll so a transient SQLITE_MISUSE on a single room does
  # not abort the whole sync (including m.call.invite delivery).
  matrix:
    path: ../matrix-dart-sdk-patched