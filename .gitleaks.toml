# Configuration gitleaks pour VOX.
#
# But : ne remonter que les secrets RÉELS. Le scan de l'historique complet
# (2026-10-06) sortait 714 findings, tous des faux positifs d'heuristique sur
# de longues chaînes : lockfile CocoaPods, doc de confidentialité, bundle web
# compilé et sa sourcemap.
#
# Vérifié le 2026-10-06 : aucun `key.properties`, token ou credential réel dans
# l'historique. `android/key.properties` est bien gitignoré (.gitignore:48).

[extend]
useDefault = true

[allowlist]
description = "Faux positifs connus : lockfiles, docs, bundles web compilés"
paths = [
  # 111 « generic-api-key » = versions/checksums de dépendances.
  '''macos/Podfile\.lock''',
  # 111 « generic-api-key » = longues chaînes de la doc.
  '''PRIVACY\.md''',
  # Clé de fuseau horaire MCS-4175 dans du code amont FlutterChat (fichier
  # supprimé depuis) : « us.cloke.msc4175.tz » matche l'heuristique générique.
  '''lib/pages/settings_profile/settings_profile_presenter\.dart''',
  # Config Firebase : la clé d'API google-services est un identifiant PUBLIC,
  # pas un secret. À noter : ce fichier a été committé (FCM est mort dans VOX).
  '''android/app/google-services\.json''',
  # 200+ « generic-api-key » = bundles/sourcemaps Dart compilés.
  '''\.js\.map$''',
  '''^web/''',
  '''^nightly/''',
  # Binaires/artefacts de build.
  '''^build/''',
  '''^\.dart_tool/''',
]
